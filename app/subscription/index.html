<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Opening Hisab Tracker...
  </title>

  <meta
    name="theme-color"
    content="#0b0f14"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      background: #0b0f14;

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      height: 100vh;

      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;

      border-radius: 24px;

      margin-bottom: 24px;

      box-shadow:
        0 0 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 700;
    }

    p {
      margin-top: 12px;

      color: #9ca3af;

      font-size: 16px;
    }

    .loader {
      margin-top: 28px;

      width: 42px;
      height: 42px;

      border: 4px solid rgba(255,255,255,0.08);

      border-top-color: #22c55e;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>

</head>

<body>

  <img
    class="logo"
    src="/favicon.ico"
    alt="Hisab Tracker"
  />

  <h1>
    Opening Hisab Tracker...
  </h1>

  <p>
    Redirecting you to the app
  </p>

  <div class="loader"></div>

<script>

  const PLAY_STORE_URL =
    'https://play.google.com/store/apps/details?id=com.hisabtrackers';

  const APP_STORE_URL =
    'https://apps.apple.com/app/idYOUR_APP_ID';

  const ua = navigator.userAgent || '';

  const isAndroid =
    /Android/i.test(ua);

  const isIOS =
    /iPhone|iPad|iPod/i.test(ua);

  // fallback to stores if app not installed
  setTimeout(() => {

    if (isAndroid) {

      window.location.href =
        PLAY_STORE_URL;

    }

    else if (isIOS) {

      window.location.href =
        APP_STORE_URL;

    }

  }, 1800);

</script>

</body>

</html>
